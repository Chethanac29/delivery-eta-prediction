[project]
name = "delivery-eta-prediction"
version = "0.1.0"
description = "Delivery ETA prediction using gradient boosted tree models"
readme = "README.md"

# IMPORTANT: restrict Python to avoid uv resolving 3.14
requires-python = ">=3.10,<3.13"

dependencies = [
    # Core
    "pandas==2.2.2",
    "numpy>=1.26,<2",

    # Parquet ecosystem
    "pyarrow==15.0.2",
    "fastparquet>=2024.2.0",

    # ML
    "scikit-learn>=1.4,<1.6",
    "xgboost>=2.0,<3.0",
    "lightgbm>=4.0,<4.5",

    # Explainability (compatible with numpy 1.x)
    "shap<0.50",

    # Viz
    "matplotlib>=3.8,<3.10",
    "seaborn>=0.13,<0.14",

    # Dev
    "ipykernel",
    "jupyter"
]